<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframes seguros</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: lightgray;
        }
    </style>
</head>
<body>
    <h1>Iframes seguros</h1>
    <p>Neste exemplo usaremos um iframe com conteúdo em javascript.</p>

    <a href="#" onclick="Clicou()">Clique aqui</a>
    <div id="saida"></div>

    <script>
        function Clicou(){
            s = window.document.getElementById("saida")
            s.innerHTML += '<p>Você clicou no link</p>'
        }
    </script>
</body>
</html>
