<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 014</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border: solid 2px #000;
            border-collapse: collapse;
            width: 500px;
        }

        thead {
            border: solid 2px #000;
            background-color: gray;
            color: white;
        }

        td, th {
            border: solid 1px #000;
            padding: 10px;
            text-align: center;
        }

        caption {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .disc {
            text-align: left;
        }

        .media {
            font-weight: bold;
            background-color: gray;
            color: white;
            text-align: left;
        }

        .num {
            font-weight: bold;
            background-color: gray;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Desafio 014</h1>
    <table>
        <caption>Resultados das Notas</caption>
        <thead>
            <tr>
                <th rowspan="2" scope="col">Área</th>
                <th rowspan="2" scope="col">Disciplinas</th>
                <th colspan="2" scope="colgroup">Notas</th>
                <th rowspan="2" scope="col">Média</th>
            </tr>
            <tr>
                <th scope="col">Nota 1</th>
                <th scope="col">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td class="disc">Matemática</td>
                <td>8</td>
                <td>7</td>
                <td>7.5</td>
            </tr>
            <tr>
                <td class="disc">Física</td>
                <td>9</td>
                <td>8</td>
                <td>8.5</td>
            </tr>
            <tr>
                <td class="disc">Química</td>
                <td>7</td>
                <td>6</td>
                <td>6.5</td>
            </tr>
            <tr>
                <td class="disc">Biologia</td>
                <td>6</td>
                <td>5</td>
                <td>5.5</td>
            </tr>
            <tr>
                <th colspan="4" class="media" scope="row">Média Exatas</th>
                <td class="num">7</td>
            </tr>
            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td class="disc">História</td>
                <td>8</td>
                <td>7</td>
                <td>7.5</td>
            </tr>
            <tr>
                <td class="disc">Geografia</td>
                <td>9</td>
                <td>8</td>
                <td>8.5</td>
            </tr>
            <tr>
                <th colspan="4" class="media" scope="row">Média Humanas</th>
                <td class="num">8</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
